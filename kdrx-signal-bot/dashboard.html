<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>بوت الإشارات KDRX</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:'Segoe UI',Tahoma,sans-serif;background:#0f1419;color:#e7e9ea;padding:20px}.container{max-width:900px;margin:0 auto}h1{text-align:center;margin-bottom:20px;color:#1d9bf0}.card{background:#1c2733;border-radius:12px;padding:20px;margin-bottom:16px}.card h2{margin-bottom:12px;color:#ffd400;font-size:1.1em}.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}.stat{background:#273340;border-radius:8px;padding:12px;text-align:center}.stat .label{font-size:.8em;color:#8b98a5;margin-bottom:4px}.stat .value{font-size:1.4em;font-weight:bold}.green{color:#00ba7c}.red{color:#f4212e}.blue{color:#1d9bf0}table{width:100%;border-collapse:collapse;font-size:.9em}th,td{padding:8px;text-align:center;border-bottom:1px solid #333}th{color:#8b98a5}.badge{display:inline-block;padding:2px 10px;border-radius:12px;font-size:.8em}.badge-win{background:#00ba7c33;color:#00ba7c}.badge-loss{background:#f4212e33;color:#f4212e}.updated{text-align:center;color:#8b98a5;font-size:.8em;margin-top:16px}.loading{text-align:center;padding:40px;color:#8b98a5}</style></head><body><div class="container"><h1>🤖 بوت الإشارات KDRX</h1><div id="app"><div class="loading">جاري التحميل...</div></div><div class="updated" id="updated"></div></div><script>const GIST_ID='4f1a5c34fe3f4e64116510a555887f00';async function load(){try{const r=await fetch('https://api.github.com/gists/'+GIST_ID);const g=await r.json();const s=JSON.parse(g.files['kdrx-state.json'].content);render(s);document.getElementById('updated').textContent='آخر تحديث: '+new Date().toLocaleString('ar')}catch(e){document.getElementById('app').innerHTML='<div class="loading">تعذر التحميل</div>'}}function render(s){const w=s.wallet||{};const pos=Object.values(w.positions||{});const closed=w.closed_trades||[];const pnl=w.total_pnl||0;const pc=pnl>=0?'green':'red';const wr=w.total_trades>0?((w.wins/w.total_trades)*100).toFixed(1):'0';let h='<div class="card"><h2>💰 المحفظة الورقية</h2><div class="stats"><div class="stat"><div class="label">الرصيد</div><div class="value blue">$'+(w.cash||0).toFixed(2)+'</div></div><div class="stat"><div class="label">البداية</div><div class="value">$'+(w.start||100).toFixed(2)+'</div></div><div class="stat"><div class="label">P&L</div><div class="value '+pc+'">$'+pnl.toFixed(2)+'</div></div><div class="stat"><div class="label">الصفقات</div><div class="value">'+(w.total_trades||0)+'</div></div><div class="stat"><div class="label">الفوز</div><div class="value">'+wr+'%</div></div><div class="stat"><div class="label">مفتوحة</div><div class="value">'+pos.length+'</div></div></div></div>';h+='<div class="card"><h2>📊 المراكز المفتوحة ('+pos.length+')</h2>';if(pos.length===0)h+='<p style="text-align:center;color:#8b98a5">لا توجد مراكز</p>';else{h+='<table><tr><th>الزوج</th><th>الاتجاه</th><th>الدخول</th><th>القيمة</th><th>SL</th><th>الأهداف</th></tr>';pos.forEach(p=>{h+='<tr><td><b>'+p.symbol+'</b></td><td>'+(p.direction==='long'?'شراء 🟢':'بيع 🔴')+'</td><td>'+p.entry+'</td><td>$'+p.notional.toFixed(2)+'</td><td>'+p.sl.toFixed(2)+'</td><td>🎯'+p.tp1.toFixed(2)+'<br>🎯'+p.tp2.toFixed(2)+'<br>🎯'+p.tp3.toFixed(2)+'</td></tr>')});h+='</table>'}h+='</div>';h+='<div class="card"><h2>📝 المغلقة ('+closed.length+')</h2>';if(closed.length===0)h+='<p style="text-align:center;color:#8b98a5">لا توجد بعد</p>';else{h+='<table><tr><th>الزوج</th><th>الدخول</th><th>الخروج</th><th>P&L</th></tr>';closed.slice(-20).reverse().forEach(t=>{const win=(t.pnl||0)>=0;h+='<tr><td><b>'+t.symbol+'</b></td><td>'+t.entry+'</td><td>'+(t.exit_price||'-')+'</td><td class="'+(win?'green':'red')+'">$'+(t.pnl||0).toFixed(2)+'</td></tr>')});h+='</table>'}h+='</div>';document.getElementById('app').innerHTML=h}load();setInterval(load,60000)</script></body></html>
