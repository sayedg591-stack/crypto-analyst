<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>بوت الإشارات KDRX - لوحة التحكم</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<style>
* { box-sizing: border-box; }
body {
  font-family: 'Segoe UI', Tahoma, sans-serif;
  background: linear-gradient(135deg, #0f1419 0%, #1a2332 50%, #0f1419 100%);
  color: #e7e9ea; min-height: 100vh; padding: 20px;
}
.glass {
  background: rgba(28, 39, 51, 0.7);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 16px;
}
.container { max-width: 1100px; margin: 0 auto; }
.tab-btn {
  padding: 6px 16px; border-radius: 20px; font-size: 0.85em;
  background: rgba(255,255,255,0.05); color: #8b98a5;
  border: 1px solid rgba(255,255,255,0.08); cursor: pointer;
  transition: all 0.2s;
}
.tab-btn:hover { background: rgba(255,255,255,0.1); }
.tab-btn.active { background: #1d9bf0; color: white; border-color: #1d9bf0; }
.progress-bg { background: rgba(255,255,255,0.08); border-radius: 8px; height: 8px; overflow: hidden; }
.progress-fill { height: 100%; border-radius: 8px; transition: width 0.5s; }
.source-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-left: 6px; }
.dot-up { background: #00ba7c; box-shadow: 0 0 8px #00ba7c; }
.dot-down { background: #f4212e; box-shadow: 0 0 8px #f4212e; }
.dot-degraded { background: #ffd400; box-shadow: 0 0 8px #ffd400; }
.dot-unknown { background: #8b98a5; }
table { width: 100%; border-collapse: collapse; font-size: 0.85em; }
th, td { padding: 10px 8px; text-align: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
th { color: #8b98a5; font-weight: 600; font-size: 0.8em; }
.badge { display: inline-block; padding: 3px 12px; border-radius: 12px; font-size: 0.78em; font-weight: 600; }
.badge-win { background: rgba(0,186,124,0.15); color: #00ba7c; }
.badge-loss { background: rgba(244,33,46,0.15); color: #f4212e; }
.badge-open { background: rgba(29,155,240,0.15); color: #1d9bf0; }
</style>
</head>
<body>
<div class="container">
  <h1 class="text-center text-3xl font-bold mb-2" style="color:#1d9bf0">🤖 بوت الإشارات KDRX</h1>
  <p class="text-center text-sm mb-6" style="color:#8b98a5">تداول ورقي • $100 وهمية • إشارات تلقائية</p>
  <div id="app"><div class="glass p-8 text-center" style="color:#8b98a5">جاري التحميل...</div></div>
  <div class="text-center text-xs mt-4" style="color:#8b98a5" id="updated"></div>
</div>
<script>
const GIST_ID = '4f1a5c34fe3f4e64116510a555887f00';
let stateData = null;
let openTab = 'all';
let closedTab = 'all';

async function load() {
  try {
    const res = await fetch(`https://api.github.com/gists/${GIST_ID}`);
    const gist = await res.json();
    const file = gist.files['kdrx-state.json'];
    stateData = JSON.parse(file.content);
    render();
    const dt = new Date(stateData.updated_at);
    document.getElementById('updated').textContent = 'آخر تحديث: ' + dt.toLocaleString('ar');
    if (window.lucide) lucide.createIcons();
  } catch (e) {
    document.getElementById('app').innerHTML = '<div class="glass p-8 text-center" style="color:#8b98a5">تعذر تحميل البيانات. حاول لاحقاً.</div>';
  }
}

function fmtTime(ts) {
  if (!ts) return '-';
  const d = new Date(ts * 1000);
  return d.toLocaleString('ar', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

function render() {
  const s = stateData;
  const w = s.wallet || {};
  const positions = Object.values(w.positions || {});
  const closed = w.closed_trades || [];
  const sys = s.system || {};
  const srcs = s.sources || {};
  const pnl = w.total_pnl || 0;
  const pnlClass = pnl >= 0 ? 'color:#00ba7c' : 'color:#f4212e';
  const winRate = w.total_trades > 0 ? ((w.wins / w.total_trades) * 100).toFixed(1) : '0';

  let html = '';

  // ===== المحفظة =====
  html += `<div class="glass p-6 mb-4"><h2 class="text-lg font-bold mb-4" style="color:#ffd400">💰 المحفظة الورقية</h2>
  <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
    <div class="glass p-4 text-center"><div class="text-xs mb-1" style="color:#8b98a5">الرصيد</div><div class="text-xl font-bold" style="color:#1d9bf0">$${(w.cash||0).toFixed(2)}</div></div>
    <div class="glass p-4 text-center"><div class="text-xs mb-1" style="color:#8b98a5">البداية</div><div class="text-xl font-bold">$${(w.start||100).toFixed(2)}</div></div>
    <div class="glass p-4 text-center"><div class="text-xs mb-1" style="color:#8b98a5">إجمالي الربح/الخسارة</div><div class="text-xl font-bold" style="${pnlClass}">$${pnl.toFixed(2)}</div></div>
    <div class="glass p-4 text-center"><div class="text-xs mb-1" style="color:#8b98a5">صفقات مغلقة</div><div class="text-xl font-bold">${w.total_trades||0}</div></div>
    <div class="glass p-4 text-center"><div class="text-xs mb-1" style="color:#8b98a5">نسبة النجاح</div><div class="text-xl font-bold">${winRate}%</div></div>
    <div class="glass p-4 text-center"><div class="text-xs mb-1" style="color:#8b98a5">مراكز مفتوحة</div><div class="text-xl font-bold">${positions.length}</div></div>
  </div></div>`;

  // ===== حالة المصادر + موارد الخادم =====
  html += `<div class="grid md:grid-cols-2 gap-4 mb-4">`;

  // مصادر
  html += `<div class="glass p-6"><h2 class="text-lg font-bold mb-4" style="color:#ffd400">📡 حالة المصادر</h2>`;
  const srcNames = {binance:'Binance', dexscreener:'DexScreener', coingecko:'CoinGecko'};
  ['binance','dexscreener','coingecko'].forEach(k => {
    const st = (srcs[k]||{}).status || 'unknown';
    const dot = st==='up'?'dot-up':st==='down'?'dot-down':st==='degraded'?'dot-degraded':'dot-unknown';
    const label = st==='up'?'متصل ✅':st==='down'?'ساقط ❌':st==='degraded'?'متدهور ⚠️':'غير معروف';
    const failover = st==='down' ? '<span class="text-xs" style="color:#ffd400"> • تبديل تلقائي ✅</span>' : '';
    html += `<div class="flex items-center justify-between py-2" style="border-bottom:1px solid rgba(255,255,255,0.05)">
      <span><span class="source-dot ${dot}"></span>${srcNames[k]}</span>
      <span class="text-sm">${label}${failover}</span></div>`;
  });
  html += `</div>`;

  // موارد الخادم
  const cpuC = (sys.cpu_pct||0) > 80 ? '#f4212e' : (sys.cpu_pct||0) > 50 ? '#ffd400' : '#00ba7c';
  const ramC = (sys.ram_pct||0) > 80 ? '#f4212e' : (sys.ram_pct||0) > 50 ? '#ffd400' : '#00ba7c';
  const diskC = (sys.disk_pct||0) > 80 ? '#f4212e' : (sys.disk_pct||0) > 50 ? '#ffd400' : '#00ba7c';
  html += `<div class="glass p-6"><h2 class="text-lg font-bold mb-4" style="color:#ffd400">🖥️ موارد الخادم</h2>`;
  html += `<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>المعالج CPU</span><span>${sys.cpu_pct||0}%</span></div><div class="progress-bg"><div class="progress-fill" style="width:${sys.cpu_pct||0}%;background:${cpuC}"></div></div></div>`;
  html += `<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>الذاكرة RAM</span><span>${sys.ram_pct||0}% (${sys.ram_used_gb||0}/${sys.ram_total_gb||0}GB)</span></div><div class="progress-bg"><div class="progress-fill" style="width:${sys.ram_pct||0}%;background:${ramC}"></div></div></div>`;
  html += `<div class="mb-3"><div class="flex justify-between text-sm mb-1"><span>القرص</span><span>${sys.disk_pct||0}%</span></div><div class="progress-bg"><div class="progress-fill" style="width:${sys.disk_pct||0}%;background:${diskC}"></div></div></div>`;
  html += `<div class="flex justify-between text-sm"><span>الحمل (دقيقة)</span><span class="font-bold">${sys.load_1m||0}</span></div>`;
  html += `<div class="flex justify-between text-sm mt-1"><span>الأنوية</span><span>${sys.cores||'-'}</span></div>`;
  html += `</div></div>`;

  // ===== الصفقات المفتوحة =====
  html += `<div class="glass p-6 mb-4"><div class="flex items-center justify-between mb-4 flex-wrap gap-2">
    <h2 class="text-lg font-bold" style="color:#ffd400">📊 الصفقات المفتوحة (${positions.length})</h2>
    <div class="flex gap-2">
      <button class="tab-btn ${openTab==='all'?'active':''}" onclick="setOpenTab('all')">الكل</button>
      <button class="tab-btn ${openTab==='win'?'active':''}" onclick="setOpenTab('win')">الرابحة</button>
      <button class="tab-btn ${openTab==='loss'?'active':''}" onclick="setOpenTab('loss')">الخاسرة</button>
    </div></div>`;
  let filtered = positions;
  // تقدير الربح/الخسارة غير المحقق غير متوفر — نعرض الكل في كل تبويب حالياً
  if (positions.length === 0) {
    html += '<p class="text-center py-6" style="color:#8b98a5">لا توجد صفقات مفتوحة حالياً</p>';
  } else {
    html += `<div class="overflow-x-auto"><table><tr><th>الزوج</th><th>الاتجاه</th><th>الدخول</th><th>الكمية</th><th>القيمة</th><th>وقف الخسارة</th><th>الأهداف</th><th>القوة</th></tr>`;
    filtered.forEach(p => {
      const dir = p.direction === 'long' ? '<span class="badge badge-win">شراء 🟢</span>' : '<span class="badge badge-loss">بيع 🔴</span>';
      html += `<tr><td><b>${p.symbol}</b></td><td>${dir}</td><td>${p.entry}</td><td>${(p.qty||0).toFixed(6)}</td><td>$${(p.notional||0).toFixed(2)}</td><td>${(p.sl||0).toFixed(2)}</td><td class="text-xs">🎯1: ${(p.tp1||0).toFixed(2)}<br>🎯2: ${(p.tp2||0).toFixed(2)}<br>🎯3: ${(p.tp3||0).toFixed(2)}</td><td>${p.signal_strength||'-'}/100</td></tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;

  // ===== سجل الصفقات المغلقة =====
  html += `<div class="glass p-6 mb-4"><div class="flex items-center justify-between mb-4 flex-wrap gap-2">
    <h2 class="text-lg font-bold" style="color:#ffd400">📝 سجل الصفقات المغلقة (${closed.length})</h2>
    <div class="flex gap-2 flex-wrap">
      <button class="tab-btn ${closedTab==='today'?'active':''}" onclick="setClosedTab('today')">اليوم</button>
      <button class="tab-btn ${closedTab==='7d'?'active':''}" onclick="setClosedTab('7d')">آخر 7 أيام</button>
      <button class="tab-btn ${closedTab==='30d'?'active':''}" onclick="setClosedTab('30d')">آخر 30 يوم</button>
      <button class="tab-btn ${closedTab==='all'?'active':''}" onclick="setClosedTab('all')">الكل</button>
    </div></div>`;
  const now = Math.floor(Date.now()/1000);
  let cFiltered = closed;
  if (closedTab === 'today') {
    const startDay = new Date(); startDay.setHours(0,0,0,0);
    cFiltered = closed.filter(t => (t.closed_at||0) >= startDay.getTime()/1000);
  } else if (closedTab === '7d') {
    cFiltered = closed.filter(t => (t.closed_at||0) >= now - 7*86400);
  } else if (closedTab === '30d') {
    cFiltered = closed.filter(t => (t.closed_at||0) >= now - 30*86400);
  }
  if (closedTab === 'all') {
    html += `<p class="text-xs mb-3" style="color:#8b98a5">تبويب «الكل» يعرض كل السجلات (${closed.length}) — لا يوجد أي حد للعرض ولا شيء مخفي.</p>`;
  }
  if (cFiltered.length === 0) {
    html += '<p class="text-center py-6" style="color:#8b98a5">لا توجد صفقات مغلقة في هذه الفترة</p>';
  } else {
    html += `<div class="overflow-x-auto"><table><tr><th>الزوج</th><th>الاتجاه</th><th>الدخول</th><th>الخروج</th><th>المستثمر</th><th>P&L</th><th>%</th><th>السبب</th><th>التاريخ</th></tr>`;
    [...cFiltered].reverse().forEach(t => {
      const win = (t.pnl||0) >= 0;
      const badge = win ? '<span class="badge badge-win">ربح ✅</span>' : '<span class="badge badge-loss">خسارة ❌</span>';
      const dir = t.direction === 'long' ? 'شراء 🟢' : 'بيع 🔴';
      const reasonMap = {'stop_loss':'🛑 وقف الخسارة','take_profit':'🎯 جني الربح','tp1':'🎯 هدف 1','tp2':'🎯 هدف 2','tp3':'🎯 هدف 3','timeout':'⏰ انتهاء المدة','rug':'🚨 انهيار'};
      const reason = reasonMap[t.reason] || t.reason || '-';
      html += `<tr><td><b>${t.symbol}</b></td><td>${dir}</td><td>${t.entry}</td><td>${t.exit_price||'-'}</td><td>$${(t.notional||t.invested||0).toFixed(2)}</td><td class="font-bold" style="${win?'color:#00ba7c':'color:#f4212e'}">$${(t.pnl||0).toFixed(2)}</td><td style="${win?'color:#00ba7c':'color:#f4212e'}">${(t.pnl_pct||0).toFixed(1)}%</td><td>${reason} ${badge}</td><td class="text-xs">${fmtTime(t.closed_at)}</td></tr>`;
    });
    html += `</table></div>`;
  }
  html += `</div>`;

  document.getElementById('app').innerHTML = html;
}

function setOpenTab(t) { openTab = t; render(); if (window.lucide) lucide.createIcons(); }
function setClosedTab(t) { closedTab = t; render(); if (window.lucide) lucide.createIcons(); }

load();
setInterval(load, 60000);
</script>
</body>
</html>
